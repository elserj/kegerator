# ============================================================
# Kegerator config — EXAMPLE / TEMPLATE
#
# To use this on your Pi:
#   1. Copy this file to "config.ini"  (cp config.example.ini config.ini)
#   2. Edit the tap names and reset flags to match your setup
#   3. The app reads "config.ini" and watches it for changes
#      (it reloads automatically ~30s after you save).
#
# NOTE: config.ini is gitignored (it holds your real tap names and
# the app writes to it). This example file is the committed template.
# ============================================================

[kegerator]
# Pour sizes in fluid ounces — measure your actual pours and update
small_pour_oz = 8
large_pour_oz = 16
growler_pour_oz = 64

# How many taps
num_taps = 4

# ------------------------------------------------------------
# One [tapN] section per tap.
#
#   name  = what's in the keg. Use "(empty)" for an empty tap
#           (it will always display as 0%).
#
#   reset = set to "true" when you put in a FRESH keg. On the
#           next reload the app fills it to capacity (640 oz) and
#           then sets reset back to "false" automatically.
# ------------------------------------------------------------

[tap1]
name = Example Beer 1
reset = false

[tap2]
name = Example Beer 2
reset = false

[tap3]
name = Example Beer 3
reset = false

[tap4]
name = (empty)
reset = true
